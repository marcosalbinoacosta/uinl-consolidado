name: Refrescar insights

on:
  schedule:
    # Todos los días a las 21:00 UTC = 17:00 hora Bolivia (UTC-4)
    # Captura el día completo de actividad del equipo en el congreso.
    - cron: "0 21 * * *"
  # Trigger manual desde Actions → "Run workflow"
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run extract
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run extract

      - name: Commit y push si hay cambios
        run: |
          if git diff --quiet data/insights.json; then
            echo "Sin cambios en data/insights.json — nada que commitear."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/insights.json
          git commit -m "data: auto-refresh insights ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
